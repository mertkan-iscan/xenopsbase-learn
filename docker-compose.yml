# The local stack (T-9.9).
#
# Everything the platform depends on, on one machine, with one command. The
# point is not convenience -- it is that this is the ONLY environment until the
# stemcell is ready to be forked into, so it has to be complete enough to build
# and test the whole domain against.
#
# WHAT IS FAITHFUL HERE AND WHAT IS NOT
#
#   Postgres, Keycloak, NATS, Valkey  -- same software as production.
#   MinIO                             -- speaks the S3 API, so it is the same
#                                        adapter and the same bucket semantics
#                                        as Hetzner Object Storage or R2. Only
#                                        the endpoint and the credentials differ.
#   content-origin                    -- a real second origin, so origin
#                                        isolation and the postMessage bridge
#                                        (T-4.3) are exercised here. Edge
#                                        signing and lifecycle rules are NOT.
#   Video                             -- NOTHING. Cloudflare Stream has no local
#                                        equivalent. `streaming` runs against a
#                                        fake MediaProvider by default; T-9.14
#                                        covers the real account.
#
# A green run of this stack does not prove edge delivery works. It cannot.

name: xenopslearn

x-restart: &restart
  restart: unless-stopped

services:

  # ---------------------------------------------------------------------------
  # Postgres -- one database per module (ADR-0109).
  #
  # Per module rather than per process, deliberately. If identity, catalog and
  # assessment end up in one process they hold three datasources, and the data
  # boundary stays real. If they are split later, nothing about the data moves.
  # ---------------------------------------------------------------------------
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Keycloak -- realm imported from this repository, never configured by hand.
  #
  # start-dev, because this is development. It uses the same image as the
  # stemcell's cluster so the realm definition is portable between them.
  # ---------------------------------------------------------------------------
  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.7.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8081"
    ports: ["8081:8081"]
    volumes:
      - ./local/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      # 26.x serves health on the management port (9000), not the HTTP port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MinIO -- the S3 endpoint. Same API as Hetzner Object Storage and R2.
  # ---------------------------------------------------------------------------
  minio:
    <<: *restart
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-xenopslearn}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-xenopslearn-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-xenopslearn}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-xenopslearn-secret}
    volumes:
      - ./local/minio:/init:ro
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"

  # ---------------------------------------------------------------------------
  # The content origin (T-4.3, T-9.5).
  #
  # A DIFFERENT ORIGIN, and that is the entire reason it exists. Uploaded SCORM
  # packages are third-party code; served from the application's origin they
  # would have the application's DOM, cookies and tokens. Here they are on
  # :8090 while the app is on :8080, which is a different origin to a browser --
  # so the postMessage bridge is exercised in development rather than first met
  # in production.
  #
  # It proxies ONLY the packages bucket. Pointing the browser at MinIO directly
  # would expose the whole S3 API on the content origin.
  # ---------------------------------------------------------------------------
  content-origin:
    <<: *restart
    image: caddy:2-alpine
    ports: ["8090:8090"]
    volumes:
      - ./local/content-origin/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      minio: {condition: service_healthy}

  # ---------------------------------------------------------------------------
  # NATS JetStream -- transport. Disposable: the outbox row is the record.
  # ---------------------------------------------------------------------------
  nats:
    <<: *restart
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"   # monitoring
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Valkey -- permission cache, rate limits, short locks. Also disposable:
  # everything in here must be rebuildable from Postgres (T-2.5).
  # ---------------------------------------------------------------------------
  valkey:
    <<: *restart
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  minio-data:
  nats-data:
