name: CI

# Everything that has to be true before a change lands, and the images that come
# out the other side (T-9.3).
#
# This repository had no pipeline at all until now. `mvn verify` and
# `npm run verify` were already exactly what one would run — three issues were
# left open on that missing half alone (T-1.6 #22, T-1.7 #23, T-10.1 #92), each
# with a gate that worked locally and gated nothing.
#
# NO `paths:` FILTER ON THE TRIGGERS, and that is deliberate rather than an
# oversight. A required status check that never runs is not reported as skipped,
# it is reported as expected — and a pull request waiting on a check that will
# never arrive cannot be merged, ever. So the workflow always starts and the
# jobs decide for themselves whether there is anything to do. A skipped job
# counts as success to branch protection; a workflow that never ran counts as
# nothing at all. (The stemcell learned this in its own T-0.7; inherited rather
# than rediscovered.)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch. A push that supersedes an in-flight run makes that run's
  # answer irrelevant, and the images it would publish are for a commit nobody
  # is going to deploy.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Corretto 25, matching scripts/java-home.sh, which exists because this
  # machine had three JDKs and none of them selected.
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: corretto
  # LTS. Local development runs 25 (Current); both satisfy Vite 8 and the
  # toolchain, and CI is the wrong place to be on a release line that moves.
  NODE_VERSION: '24'

jobs:
  services:
    name: services (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # Most of this suite is Testcontainers: identity, streaming and reporting
      # all start a real Postgres, and two start a real Valkey. This fails
      # loudly if a runner ever stops having a daemon, rather than every
      # integration test erroring with "Could not find a valid Docker
      # environment" and nobody knowing why.
      - name: Check Docker is available
        run: docker info > /dev/null

      # Load tests are excluded by <excluded.test.groups> in services/pom.xml.
      # They take tens of seconds and produce a number to read rather than an
      # assertion to pass, so a threshold on a shared runner would be a test
      # that fails when the runner is busy. docs/slos.md is where their figures
      # live, with the conditions that produced them.
      - name: Build and test
        run: mvn --batch-mode --file services/pom.xml verify

  web:
    name: web (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # lint, tsc + build, and vitest with axe. The accessibility assertions are
      # ordinary assertions in this suite rather than a separate job somebody
      # remembers to run.
      - name: Verify
        working-directory: web
        run: npm run verify

  contract:
    name: API contract (generated client vs running services)
    runs-on: ubuntu-latest
    # THE CRITERION T-10.1 (#92) WAS LEFT OPEN ON.
    #
    # `npm run api:check` regenerates the typed client against a LIVE service and
    # fails on any difference, and it fails when it cannot reach one — a check
    # that passes with nothing to compare against reports success for work it did
    # not do. That makes it the one gate here that needs the whole stack up, and
    # the reason it could not be a local habit: nobody runs three services and a
    # Keycloak before pushing.
    #
    # It is also the gate that would have caught the drift found by hand on
    # 2026-09-04, where T-1.4's setStatus and T-9.11's /internal/whoami had been
    # merged without regenerating and nothing noticed.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Start the local stack
        run: cp .env.example .env && make up

      - name: Build the services
        run: mvn --batch-mode --file services/pom.xml --define skipTests package

      # Backgrounded and then waited for, rather than assumed up. Each writes a
      # log that is uploaded on failure, because "the contract check could not
      # reach identity" is not a diagnosis.
      - name: Run identity, streaming and reporting
        run: |
          for service in identity streaming reporting; do
            nohup java -jar "services/${service}/target/${service}-0.0.1-SNAPSHOT.jar" \
              > "/tmp/${service}.log" 2>&1 &
          done
          for port in 8082 8083 8084; do
            for _ in $(seq 1 90); do
              if curl -sf "http://localhost:${port}/v3/api-docs" > /dev/null; then
                echo "port ${port} serving its contract"
                break
              fi
              sleep 2
            done
            curl -sf "http://localhost:${port}/v3/api-docs" > /dev/null \
              || { echo "::error::nothing serving on ${port}"; exit 1; }
          done

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Fail if the committed client has drifted
        working-directory: web
        run: npm run api:check

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-logs
          path: /tmp/*.log
          if-no-files-found: warn

  publish:
    name: publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    # ONLY AFTER EVERYTHING PASSES, AND ONLY ON main.
    #
    # A commit that fails its tests must not be able to publish an image: the tag
    # would exist, be pullable, and be indistinguishable from one that passed.
    # And a pull request must not publish at all — an image built from a branch
    # nobody merged is an image somebody can deploy.
    needs: [services, web, contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # The only job that gets these. GITHUB_TOKEN is scoped per job, so a
      # compromised step in `services`, `web` or `contract` cannot push or sign.
      packages: write
      # Keyless signing. cosign exchanges this short-lived OIDC token for a
      # Fulcio certificate bound to THIS workflow, at this ref, in this
      # repository, and records the signature in Rekor. No private key exists to
      # be stolen or rotated, and the identity in that certificate is what
      # verification checks -- which is what makes "only images this pipeline
      # built" enforceable rather than aspirational.
      id-token: write
      # SLSA provenance: a signed statement of which workflow, commit and runner
      # produced the image, attached in the registry beside it.
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # The three deployable processes. `platform-common` is a library and
        # says so in its own pom, where jib is skipped with the reason.
        service: [identity, streaming, reporting]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven
          cache-dependency-path: services/pom.xml

      # No Dockerfile and no daemon: jib builds the layers and pushes them
      # itself. The dependency layer only changes when a dependency does, which
      # is what keeps a one-line code change from re-uploading 170MB.
      #
      # TAGS ARE IMMUTABLE AND TRACEABLE, which is this issue's second criterion.
      # The commit SHA is the tag that matters; `main` is a convenience for
      # humans reading the package list and MUST NOT appear in a manifest. The
      # deploy pins a digest — see platform/README.md.
      #
      # ONE reactor invocation, not two. The first attempt packaged
      # `platform-common,<service>` and then ran jib in a second `mvn` scoped to
      # the service alone -- which could not resolve platform-common, because
      # `package` leaves it in the reactor rather than in the local repository.
      # Every publish failed with "Could not find artifact platform-common"
      # AFTER all three gates had passed.
      #
      # `--also-make` keeps both modules in one reactor so the dependency
      # resolves from it. jib then runs against platform-common too, which is
      # harmless: that module skips the plugin deliberately and its pom says why.
      - name: Build and push
        run: |
          mvn --batch-mode --file services/pom.xml \
            --projects ${{ matrix.service }} --also-make \
            --define skipTests package jib:build \
            --define jib.to.tags=${{ github.sha }},main \
            --define jib.to.auth.username=${{ github.actor }} \
            --define jib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

      # Signing or attesting a TAG would sign whatever that tag points at when a
      # verifier looks, which is a different image the moment `main` moves. Jib
      # writes the digest of what it actually pushed; that is what gets signed,
      # attested and verified.
      - name: Resolve the pushed digest
        id: digest
        run: |
          digest="$(cat services/${{ matrix.service }}/target/jib-image.digest)"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::jib-image.digest is not a digest: '${digest}'"; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/mertkan-iscan/xenopsbase-learn/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # cosign WRITES the signature to the registry beside the image, so it needs
      # its own credentials: jib was given them via -Djib.to.auth.* and cosign
      # inherits nothing from that. The stemcell's first run without this pushed
      # the image and then failed with UNAUTHORIZED on the signature upload.
      #
      # --password-stdin rather than -p: an argument is visible in the process
      # list, and this is the token that can push images.
      - name: Log in to GHCR for cosign
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --new-bundle-format=false IS LOAD-BEARING, and inherited rather than
      # rediscovered. cosign 3.x defaults to the Sigstore bundle format, which it
      # publishes under the OCI referrers fallback tag `sha256-<digest>`;
      # sigstore/policy-controller looks for the classic `sha256-<digest>.sig`
      # and, finding none, reports "no signatures found" at admission time. The
      # image is signed and the cluster refuses it, which is the worst shape a
      # failure can take.
      - name: Sign the image
        env:
          COSIGN_YES: 'true'
        run: |
          cosign sign --new-bundle-format=false --use-signing-config=false             "${{ steps.digest.outputs.image }}@${{ steps.digest.outputs.digest }}"

      - name: Assert the signature is where a verifier will look
        run: |
          tag="$(printf '%s' '${{ steps.digest.outputs.digest }}' | tr ':' '-').sig"
          cosign manifest download "${{ steps.digest.outputs.image }}:${tag}" > /dev/null

      # Proves the signature verifies against the identity a cluster policy would
      # require, in the run that made it. A signature nobody checks is a
      # signature that can quietly stop being valid.
      - name: Verify the signature we just made
        run: |
          cosign verify             --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/'             --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'             "${{ steps.digest.outputs.image }}@${{ steps.digest.outputs.digest }}"

      - name: Attest SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digest.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}

      - name: Report the digest
        run: |
          digest='${{ steps.digest.outputs.digest }}'
          {
            echo "### ${{ matrix.service }}"
            echo
            echo '```'
            echo "image:  ${{ steps.digest.outputs.image }}"
            echo "digest: ${digest}"
            echo "commit: ${{ github.sha }}"
            echo '```'
            echo
            echo "Pin the digest in \`platform/envs/dev/services/kustomization.yaml\`."
          } >> "$GITHUB_STEP_SUMMARY"
