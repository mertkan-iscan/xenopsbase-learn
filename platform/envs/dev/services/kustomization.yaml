apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The application services. Everything they run ON — Postgres, Keycloak, Valkey,
# the ingress — is the stemcell's, deliberately: this product does not operate a
# second copy of the platform, it is a tenant of the one that exists.
resources:
  # The issuer every service reads, and which they all wait for before starting.
  # Listed first because nothing below starts without it.
  - oidc.yaml
  - identity.yaml
  - streaming.yaml
  - reporting.yaml

  # CATALOG AND ASSESSMENT, which had been building, testing and publishing
  # images for weeks with no Deployment. Nothing reported it: a service nobody
  # deploys is a green build. They arrive together with the routing that made
  # them reachable (#143).
  #
  # THEIR DATABASE ROLES AND SECRETS MUST EXIST FIRST
  # (xenopsbase-stemcell#452). A pod that starts before its role does is a
  # CrashLoopBackOff with a five-minute backoff, and the fix is then waiting
  # rather than acting.
  - catalog.yaml
  - assessment.yaml

  # THE PUBLIC HALF (T-10.2), added together because none of the three is any
  # use without the other two: the ingress needs both backends to exist, and a
  # backend with no ingress is a pod nobody outside the cluster can reach.
  - gateway.yaml
  - frontend.yaml
  - ingress.yaml

# IMAGES ARE PINNED HERE, NOT IN THE DEPLOYMENTS.
#
# So a deploy is a one-line commit and `git log` on this file is the deployment
# history. The `main` tag in each Deployment is a placeholder this overrides.
#
# BY DIGEST, NOT BY TAG, and the stemcell paid for that lesson twice over:
#
#  - `main` moves, and with imagePullPolicy: IfNotPresent a node keeps whatever
#    it cached, so two replicas can run different code and nothing reports it.
#  - on one occasion the tag did not even exist. Jib logged that it had pushed
#    `...:<sha>, ...:main` and the package came out with only the SHA, while an
#    identical command on the other service produced all three. The kubelet's
#    "not found" was the first sign.
#
# A digest cannot be absent, cannot move, and cannot disagree with what was
# tested. The commit is recorded beside each one so a reader does not have to
# resolve a digest to know which build this is — per image, because they do not
# move together.
images:
  - name: ghcr.io/mertkan-iscan/xenopsbase-learn/catalog
    # Commit 2f93663, and the first image this service has ever run.
    #
    # Courses, gates, assignments, due dates, the learner home screen, and the
    # interstitials pinned inside a video's timeline. It both publishes and
    # consumes on the bus: streaming's derived completions and assessment's
    # graded attempts become node_completion rows here, which is what lets a
    # gate be ONE query against catalog's own table.
    #
    # 2026-09-10 — MOVED TO 7f4ad4f, AND THE IMAGE ABOVE NEVER STARTED. It
    # crash-looped on this cluster with
    #
    #     Could not subscribe catalog-attemptgradedhandler to
    #     assessment.attempt.graded
    #     [SUB-90007] No matching streams for subject
    #
    # because `Streams.TOPOLOGY` declared identity, catalog, streaming and
    # reporting and assessment was never added to it (#146). The stream did not
    # exist on the broker; checked there rather than inferred.
    #
    # This service was the one that failed and the one that was right to. A
    # subscriber gets an error for a missing stream; a publisher does not, which
    # is why the fault surfaced here rather than in the service that had the
    # bug.
    #
    # The digest is byte-identical to the one 9c78041 published, because #147
    # touched only assessment's configuration and this module's inputs did not
    # move.
    digest: sha256:452d7a5c945176222e20c8210cdaed93693d119ab1b36d1e095a6f9dc8b43ec4
  - name: ghcr.io/mertkan-iscan/xenopsbase-learn/assessment
    # Commit 2f93663, and the first one.
    #
    # The largest surface in the product: banks, questions, tests, forms,
    # attempts, marking, integrity signals and review. It publishes
    # assessment.attempt.graded, which is how a passed test opens the gate
    # behind it -- without which a learner can pass a certification exam and
    # stay locked out of the course, with nothing reporting a fault.
    #
    # 2026-09-10 — MOVED TO 7f4ad4f, and the image above was the more dangerous
    # of the two. It ran. It reported healthy for fifteen minutes. It was not
    # connected to the bus at all.
    #
    # `platform.outbox.enabled: true` was set and `platform.messaging` was
    # absent, so MessagingConfiguration wired RecordingPublisher -- which
    # records a message and delivers it nowhere (#147). NATS_URL was on the pod
    # the whole time, with a comment in the manifest explaining why this service
    # needs it. Nothing read it, because nothing here mapped it.
    #
    # So the sentence in the note above was false for the life of that image: a
    # learner COULD pass a certification exam and stay locked out of the course
    # behind it, with nothing reporting a fault. That is what the deploy found.
    #
    # Both halves are now checked before a merge -- StreamsTest for the stream,
    # scripts/verify_messaging.py for the wiring -- and both were confirmed to
    # fail with their fix removed.
    digest: sha256:71c2f068b65cbd292093e92373f45ee7124e47834b2208f5e0a359360971dbf9
  # GATEWAY, STREAMING, IDENTITY AND REPORTING STAY AT 2f93663, one commit
  # behind the three above.
  #
  # They embed the same platform-common, so their images do differ -- but the
  # only change in it is a stream declaration none of them subscribes to, and
  # `Streams.apply` adds and updates without ever deleting. An old pod
  # restarting therefore cannot remove the assessment stream the new ones
  # create, which is the property that makes leaving them here safe rather than
  # merely convenient.
  #
  # Moving seven images to fix two is a larger blast radius than the fault
  # justifies. They move on their own next deploy.
  - name: ghcr.io/mertkan-iscan/xenopsbase-learn/gateway
    # Commit d04d4b6, and the first image this service has ever had (T-10.2).
    #
    # It is the only process here a browser talks to: it holds the session, and
    # the access and refresh tokens inside it, so that no token is ever in a
    # page that also renders uploaded packages. Everything under /api is
    # relayed through it with a token it obtained and renewed itself.
    #
    # WHAT HAS TO BE TRUE AROUND IT, or sign-in fails after a successful login
    # at Keycloak -- which is the worst place for it to fail, because the
    # person has already authenticated:
    #   - the realm's `gateway` client must list
    #     https://learn-dev.xenopsoftware.com/login/oauth2/code/oidc
    #   - learn-gateway-client must exist in this namespace
    #     (xenopsbase-stemcell#451)
    #
    # 2026-09-10 — MOVED TO 2f93663, AND THIS IS THE MOVE THAT MAKES THE TWO
    # SERVICES BELOW REACHABLE. The image above is d04d4b6, whose `Upstreams`
    # does not contain the string "catalog" anywhere: its routing table knows
    # identity, streaming and reporting, so 70 of the platform's 151 operations
    # answered 404 at the door no matter what was running behind it (T-9.11,
    # #143).
    #
    # Deploying catalog and assessment without this would have been the same
    # bug in a more expensive form -- two healthy pods, a green Argo sync, and
    # every call to either still refused by the router in front of them.
    #
    # The table is ordered and the order is load-bearing: two services answer
    # under /api/v1/me, so `/api/v1/me/nodes/*/interstitials` is listed before
    # the general streaming rule or a learner's interstitials go to the wrong
    # service. `Route.matches` is segment-wise now rather than a prefix test,
    # which is what makes the wildcard mean one segment instead of "anything
    # after here".
    digest: sha256:c3fd162b9cdd0d1675989aefefcaf6aad233ac1ca8ac84f4a2fcfd3e86e3e846
  - name: ghcr.io/mertkan-iscan/xenopsbase-learn/frontend
    # Commit d04d4b6, and the first one. nginx and the Vite build -- no Node in
    # any request path, which is what lets a learner's page load when none of
    # our services are running (T-3.10, docs/frontend.md).
    #
    # The only image here that jib did not build: it comes from web/Dockerfile,
    # built and signed by the `publish frontend image` job with the same cosign
    # identity, because this namespace's ClusterImagePolicy covers the whole
    # registry path and would refuse an unsigned one.
    #
    # 2026-09-10 — MOVED TO 7f4ad4f: the design system and the screens it was
    # built to serve (#145). Until now this image served a page with visible
    # focus, landmarks and a skip link and no design at all, which is what
    # docs/frontend.md meant by a design system arriving "with the screens it
    # has to serve".
    #
    # Home and the review screen read real endpoints; the console's three
    # screens carry fixtures and each says in its own file what has to exist
    # before it goes live. The eight semantic states are a closed union, and
    # `awaiting grading` is drawn as its own unresolved state rather than a
    # greyed-out fail -- which is the rendering mistake that would lock a
    # learner out of a course they had passed.
    #
    # It lands in the same commit as the two fixes above deliberately: this
    # image's home screen calls catalog's /api/v1/me/home, and shipping it
    # against a crash-looping catalog would have put the design on the cluster
    # as an error state.
    digest: sha256:34fc931e03c9362c4b49d03ae525616d10ec67cf5266efd966c56ee177589b0f
  - name: ghcr.io/mertkan-iscan/xenopsbase-learn/identity
    # Commit 0747e6c — the first images this repository has ever published
    # (T-9.3, #11). Carries everything through T-3.6: the tenant boundary and
    # the discriminator (T-1.1), app_user owning identity with `sub` as a
    # repairable link (T-1.2, ADR-0104), the group tree (T-1.3), account status
    # (T-1.4), provisioning as an API call (T-1.5), the invite and deactivate
    # lifecycle (T-1.9), the permission catalog and its evaluator (T-2.1, T-2.4),
    # roles, scopes and the no-escalation rule (T-2.2, T-2.3, T-2.6), the Valkey
    # permission cache (T-2.5), the seeded system roles (T-2.7) and
    # service-to-service authentication (T-9.11).
    #
    # 2026-09-05 — MOVED TO 6a71d6f, THE FIRST DEPLOY THIS FILE HAS EVER MADE.
    # Adds per-company SSO (T-1.8): tenant_identity_provider keyed on the alias,
    # so a second company claiming one is a 409 from the database rather than a
    # rule somebody remembers, and hardcoded tenant_id/side mappers with
    # syncMode FORCE so a customer's provider cannot assert its way into another
    # company. Plus the regenerated client the contract gate demanded.
    #
    # 2026-09-06 — MOVED TO c21e960, and the reason is T-9.8: the message bus.
    # Until now `platform.messaging.nats-url` was empty in every environment,
    # which application.yml calls "the local default rather than the only one" —
    # so the outbox filled, the relay drained it, and every message went
    # nowhere. There is a broker now, in the stemcell's `messaging` namespace,
    # and NATS_URL below points at it. `Streams` declares `identity.>` at
    # startup, so the stream exists the first time this connects.
    #
    # Also carries T-5.6, which is a deadline being a date rather than an
    # instant, and T-0.9's ADR-0109.
    #
    # 2026-09-07 — moved to 9f6aa7d. Inter-service calls are gated on the
    # `svc-caller` realm role, not on the `svc` claim alone (T-9.11, #89). The claim
    # keeps its job -- it says WHICH service is calling -- and the role is the
    # gate, so revoking it now does something. It did not before: nothing looked.
    #
    # THE REALM MUST CARRY THE ROLE BEFORE THIS ROLLS, and it does: xenopslearn
    # was re-imported at 00:3x with svc-caller and a service account per svc-*
    # client holding it. Deploying this against a realm without the role refuses
    # every inter-service call.
    #
    # Also carries the platform-common split (#115): the servlet half of the
    # shared library is its own module now, which changes no behaviour and is
    # why all three images move together.
    #
    # 2026-09-08 — moved to 8d2480d. ONE ERROR SHAPE, AND IT IS RFC 9457
    # (T-9.10, #88). This service alone used to write three of the five the platform
    # had: {"reason","message"} from the impersonation filter, {"message"} from
    # the deactivated-user filter, and an empty body from the access-denied
    # advice. All three are problem documents now, on
    # application/problem+json, and the `reason` field became `code`.
    #
    # A CLIENT-VISIBLE CHANGE, and the only one in this deploy that is. Nothing
    # outside this repository consumes these bodies yet -- the player is the one
    # reader and it moved in the same commit.
    #
    # 2026-09-08 — moved to e3d30b5. The problem documents its filters write are
    # UTF-8 now. The image above answered
    # `application/problem+json;charset=ISO-8859-1`, because setContentType with
    # no charset lets Tomcat pick -- found by reading the headers off this very
    # deployment, with every unit test green.
    #
    # 2026-09-09 — moved to 335e473. TWO THINGS, and the second is why the first
    # is worth reading carefully.
    #
    # A MISSING CACHE NOW COSTS ONE TIMEOUT PER WINDOW (#126, #127). The cooldown
    # this service already had is now `DegradableCache` in platform-common, so
    # the two callers that never wrote one -- the tenant status gate, on every
    # request in every service but this one, and the playback mint limit -- have
    # it too. The permission cache loses its private copy and its health
    # indicator now prints the shared document: `mode` is `ok`, `degraded` or
    # `absent` rather than a sentence.
    #
    # Also carries the OpenAPI error schemas (T-9.10, #123) and T-6.1's share of
    # the permission model -- PermissionScope, Reach and ScopeResolver gained the
    # bank scope, which this service owns even though the service that uses it is
    # not deployed here.
    digest: sha256:f0a60c141d58c48e67be0dba8ec84ebc21c2f5a8423663b591188410c09fb605
  - name: ghcr.io/mertkan-iscan/xenopsbase-learn/streaming
    # Commit 0747e6c — the MediaProvider port and its fake and Cloudflare
    # adapters (T-3.1), tus upload targets with quota enforced before issuance
    # (T-3.2), encode state arriving by webhook and poll idempotently (T-3.3),
    # and the playback entitlement decision with its five-minute token (T-3.4).
    #
    # Runs the FAKE media provider here. Video is the one dependency with no
    # local or in-cluster equivalent, so a green deployment proves the domain
    # and nothing about edge delivery (T-9.14, #100).
    #
    # 2026-09-05 — moved to 6a71d6f, the first deploy. Adds T-9.14's work on
    # the Cloudflare side: the token proved by using it, and the two properties
    # nothing was setting. The provider selected HERE is still the fake one, so
    # that changes what the adapter can do and not what this deployment does.
    #
    # 2026-09-06 — moved to c21e960. T-3.7 (watched intervals, because a
    # furthest position is a claim), T-3.10 (playback survives the backend being
    # down) and T-5.8's share of the learner home. Plus the message bus, and
    # `streaming.>` with it.
    #
    # Still the FAKE media provider, so what changed is the domain and not edge
    # delivery.
    #
    # 2026-09-07 — moved to 9f6aa7d for the svc-caller gate and the
    # platform-common split. No change of its own; see the note on identity.
    #
    # 2026-09-08 — moved to 8d2480d for the RFC 9457 error shape (T-9.10, #88). The
    # playback and progress refusals keep their codes -- PLAYBACK_NOT_ENTITLED,
    # LEARNER_UNRESOLVED -- as an extension member beside the standard fields,
    # which is why the player switches on one field rather than parsing a URI.
    #
    # The undisclosed refusal still answers with NO BODY at all: an empty 404 is
    # the same answer a genuinely missing node gives, and that is the point.
    #
    # 2026-09-08 — moved to e3d30b5 for the UTF-8 fix in the shared filter path.
    # No change of its own; see the note on identity.
    #
    # 2026-09-09 — moved to 335e473. The mint rate limiter no longer asks an
    # unreachable Valkey on every playback token (#126, #127): it fails open as
    # before, and now stops asking for a cooldown window, which is the difference
    # between a limiter that is off and a token endpoint that is slow.
    #
    # THE STOCK REDIS HEALTH INDICATOR IS OFF IN THIS IMAGE. Until now this
    # service's aggregate /management/health was the only thing that would have
    # said Valkey was unreachable -- and it did say so, 503, for the whole life
    # of the previous deployment, with nobody reading it. `caches` replaces it:
    # always UP, one entry per cache, and it names which are being skipped.
    #
    # Also carries the OpenAPI error schemas (T-9.10, #123): the playback and
    # progress refusals are documented, and the undisclosed 404 is declared with
    # an empty content so the spec stops claiming it returns a token.
    #
    # 2026-09-10 — moved to 2f93663, and it is the interstitial hold that makes
    # this worth taking now rather than later. `ProgressService` clips a claimed
    # interval at the frontier catalog reports and refuses the batch with
    # INTERSTITIAL_UNANSWERED only when the whole of it is past that second
    # (T-5.4) -- which is a conversation with a service that does not exist on
    # this cluster until the digests below land. Rolling the two together keeps
    # the caller and the callee at one commit.
    #
    # The frontier is re-read only when a batch crosses the cached value, so a
    # video with no pinned questions costs no calls at all.
    digest: sha256:2e38a5a9e68112e5dbeb3228c11859130afbae9c420e7ffece05a385d846e731
  - name: ghcr.io/mertkan-iscan/xenopsbase-learn/reporting
    # Commit 0747e6c — the service and its own database with nothing else
    # reading it (T-9.7), and the playback heartbeat ingest path (T-3.6):
    # validate, batch-insert, count, and never a synchronous call while a
    # learner waits.
    #
    # 2026-09-05 — moved to 6a71d6f, the first deploy. Nothing in this service
    # changed between 0747e6c and here; it moves because all three are built
    # from one commit and a deployment naming three different ones is a harder
    # thing to reason about than a rebuild.
    #
    # 2026-09-06 — moved to c21e960, and NOTHING IN THIS SERVICE CHANGED.
    # `services/reporting` has no commit between 6a71d6f and here. It moves
    # because platform-common does: T-9.8 put the relay, the subscriber and
    # `Streams` in the shared module, so this image gains a working outbox
    # without a line of its own changing. That is worth stating rather than
    # leaving a reader to diff and find nothing.
    #
    # 2026-09-07 — moved to 9f6aa7d. Reporting neither publishes, consumes, nor
    # makes service calls, so it gains nothing observable from either change and
    # moves because the shared modules did.
    #
    # 2026-09-08 — moved to 8d2480d. Its two ingest refusals are problem
    # documents now; MALFORMED_BATCH survives as the code.
    #
    # 2026-09-08 — moved to e3d30b5 with the other two, for the same shared fix.
    #
    # 2026-09-09 — moved to 335e473, and this is the service the whole of #126
    # was found on. Its tenant status read is on every request, so an unreachable
    # Valkey queued every caller behind one connection: ~1 req/s at 20-60m of
    # CPU, and at 64 concurrent the liveness probe restarted the container. The
    # read now costs one attempt per cooldown window.
    #
    # THE STOCK REDIS HEALTH INDICATOR IS OFF IN THIS IMAGE, for the reason
    # written on streaming above. Its 503 was accurate and unread for five hours.
    #
    # Also carries the OpenAPI error schemas (T-9.10, #123) for the two ingest
    # refusals.
    digest: sha256:788d2186078b3565b1d6dabd2324a54543c71da3cc6ce6101899b21bcaefc0b9
