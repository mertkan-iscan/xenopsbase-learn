  - name: ghcr.io/mertkan-iscan/xenopsbase-learn/reporting
    # Commit 0747e6c — the service and its own database with nothing else
    # reading it (T-9.7), and the playback heartbeat ingest path (T-3.6):
    # validate, batch-insert, count, and never a synchronous call while a
    # learner waits.
    #
    # 2026-09-05 — moved to 6a71d6f, the first deploy. Nothing in this service
    # changed between 0747e6c and here; it moves because all three are built
    # from one commit and a deployment naming three different ones is a harder
    # thing to reason about than a rebuild.
    #
    # 2026-09-06 — moved to c21e960, and NOTHING IN THIS SERVICE CHANGED.
    # `services/reporting` has no commit between 6a71d6f and here. It moves
    # because platform-common does: T-9.8 put the relay, the subscriber and
