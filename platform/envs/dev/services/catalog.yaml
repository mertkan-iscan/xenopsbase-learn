# catalog: what training exists, who it reaches, and what is pinned inside it.
#
# Courses, modules and ordered nodes (T-5.2); gates and reachability (T-5.3);
# assignments and due dates (T-5.5, T-5.6); the learner home screen (T-5.8); and
# the interstitials pinned inside a video's timeline (T-5.4).
#
# ITS OWN DATABASE OUTRIGHT, and nothing else reads it (ADR-0109). The rule that
# is easiest to break here is the one an ArchUnit test already guards: a content
# item POINTS at a streaming asset and asks its owner, it never copies the
# duration -- because a duration copied here goes stale on a re-encode and the
# bug it produces is a progress bar that disagrees with the video, discovered by
# a learner and diagnosed nowhere near catalog.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: learn
  labels: {app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: xenopslearn}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: catalog}
  template:
    metadata:
      labels: {app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: xenopslearn}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}

      # WAIT FOR THE OIDC ISSUER RATHER THAN DYING ON IT.
      #
      # Inherited from the stemcell's T-3.24 rather than rediscovered. Spring
      # resolves the issuer's discovery document while building beans, with one
      # HTTP GET and no retry, and that GET decides whether the context starts.
      # On a cold cluster the order is postgres, then keycloak, then the apps —
      # and the apps lose that race every time.
      #
      # Losing it is not a delay, it is a crash: the context fails, the
      # container exits, and the kubelet backs off up to five minutes. The
      # service then stays down long after Keycloak is healthy, and only a
      # manual rollout restart recovers it.
      #
      # This waits indefinitely and the pod sits in Init, deliberately: exiting
      # non-zero would rebuild the same CrashLoopBackOff one layer up.
      initContainers:
        - name: wait-for-oidc
          # Pinned by digest like every other off-the-shelf image, and chosen
          # over the service's own because eclipse-temurin — what jib builds on
          # — ships neither curl nor wget.
          #
          # THIS EXACT DIGEST IS WHAT THE CLUSTER ADMITS. The `learn` namespace
          # is enrolled in policy-controller, where an image matching no policy
          # is denied -- and learn's own ClusterImagePolicy covers only
          # ghcr.io/mertkan-iscan/xenopsbase-learn/**. What lets this through is
          # the stemcell's `third-party-images-by-digest`, which passes this
          # digest and nothing else. Bumping curl here without bumping it there
          # is refused at admission, and the symptom is three pods stuck in Init
          # with nothing wrong in their logs.
          image: curlimages/curl@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13  # 8.21.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - name: OIDC_ISSUER_URI
              valueFrom: {configMapKeyRef: {name: learn-oidc, key: OIDC_ISSUER_URI}}
          command: [sh, -c]
          args:
            - |
              set -u
              url="${OIDC_ISSUER_URI}/.well-known/openid-configuration"
              echo "waiting for OIDC discovery before starting: $url"
              start=$(date +%s)
              while :; do
                code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" 2>/dev/null || true)
                [ -n "$code" ] || code=000
                elapsed=$(( $(date +%s) - start ))
                if [ "$code" = "200" ]; then
                  echo "OIDC discovery answered 200 after ${elapsed}s — starting"
                  exit 0
                fi
                echo "  ${elapsed}s: ${code} — waiting (000 is DNS/edge/cert, 404 is the wrong realm path)"
                sleep 5
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}

      containers:
        - name: catalog
          # Overridden by digest in kustomization.yaml. This tag is a
          # placeholder and MUST NOT be what runs: `main` moves, and with
          # imagePullPolicy IfNotPresent a node keeps whatever it cached, so two
          # replicas can run different code and nothing reports the difference.
          image: ghcr.io/mertkan-iscan/xenopsbase-learn/catalog:main
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8085}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: SERVER_PORT, value: "8085"}
            - name: OIDC_ISSUER_URI
              valueFrom: {configMapKeyRef: {name: learn-oidc, key: OIDC_ISSUER_URI}}

            # Its own database and its own role inside the SHARED cluster, like
            # Keycloak's and core's. The isolation that matters — one module
            # unable to read or rewrite another's tables — comes from separate
            # roles and databases, not from separate Postgres clusters, and this
            # way learn's data is covered by the same WAL archive as everything
            # else rather than becoming a new exception to ADR-0002.
            - name: CATALOG_DB_URL
              value: jdbc:postgresql://postgres-rw.database.svc.cluster.local:5432/learn_catalog
            - name: CATALOG_DB_USER
              valueFrom: {secretKeyRef: {name: learn-catalog-db, key: username}}
            - name: CATALOG_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: learn-catalog-db, key: password}}

            # The permission cache (T-2.5). The cluster's Valkey requires a
            # password; without it every read would fail NOAUTH and degrade into
            # the "Valkey is down" path this service is built to survive, which
            # is the worst shape available because nothing would look broken.
            - {name: VALKEY_HOST, value: valkey-cache.cache.svc.cluster.local}
            - {name: VALKEY_PORT, value: "6379"}
            - name: VALKEY_PASSWORD
              valueFrom: {secretKeyRef: {name: valkey-client, key: password}}

            # Service-to-service (T-9.11). Per service and rotatable on its own:
            # a shared secret would make rotating any of them an outage for all
            # of them, and would let any service claim to be another.
            - {name: SERVICE_CLIENT_ID, value: svc-catalog}
            - name: SERVICE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: learn-service-clients, key: catalog}}
            - {name: IDENTITY_URL, value: http://identity.learn.svc.cluster.local:8082}
            - {name: STREAMING_URL, value: http://streaming.learn.svc.cluster.local:8083}
            - {name: REPORTING_URL, value: http://reporting.learn.svc.cluster.local:8084}
            - {name: CATALOG_URL, value: http://catalog.learn.svc.cluster.local:8085}
            - {name: ASSESSMENT_URL, value: http://assessment.learn.svc.cluster.local:8086}

            # THE BUS. Catalog both publishes and consumes, which is what
            # separates it from reporting: it folds streaming's derived
            # completions and assessment's graded attempts into node_completion
            # so a gate evaluation stays ONE query against its own table rather
            # than calls into whichever module observed the evidence (T-5.3,
            # T-6.7). Without this the gates are correct and permanently shut.
            - {name: NATS_URL, value: nats://nats.messaging.svc.cluster.local:4222}

            # Mail, for the reminder pass (T-5.6) and for telling a learner
            # their pending attempt has been marked (T-6.7).
            #
            # DELIBERATELY UNSET. Without spring.mail.host the LoggingMailer is
            # wired and every letter is written to the log instead of sent --
            # which is the honest state for a dev cluster with no mail provider,
            # and the one `Mailer.delivers()` reports at startup so a green
            # deployment does not read as working mail.
          readinessProbe:
            httpGet: {path: /management/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /management/health/liveness, port: http}
            periodSeconds: 20
          resources:
            # 512Mi/896Mi, the same envelope every service here declares and
            # the one scripts/verify_capacity.py fails on if it drifts.
            #
            # NOT MEASURED ON THESE PODS. Reporting's numbers (278Mi at start,
            # 339-370Mi warm, 406Mi worst) came from a load test against
            # reporting, and this service has never run on the cluster. The
            # envelope is the platform's shared one until somebody takes a
            # reading here -- which is worth doing, because assessment holds
            # more in memory per request than reporting does and catalog builds
            # a whole course tree for the home screen.
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 896Mi}
          volumeMounts:
            # readOnlyRootFilesystem is on and Tomcat still needs a writable
            # java.io.tmpdir: it creates its work directory under /tmp before
            # the context refreshes. Without this the pod does not fail a
            # health check, it fails to start at all --
            # "Unable to create tempDir. java.io.tmpdir is set to /tmp",
            # caused by a Read-only file system, on every restart.
            #
            # An emptyDir rather than relaxing the root filesystem, which is the
            # same trade the stemcell's own services make: scratch space is
            # writable, everything the image ships is not.
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: learn
  labels: {app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: xenopslearn}
spec:
  selector: {app.kubernetes.io/name: catalog}
  ports:
    - {name: http, port: 8085, targetPort: http}
