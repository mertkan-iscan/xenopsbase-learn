# catalog — configuration.
#
# Values here are the LOCAL STACK's. Anything that differs per environment is an
# environment variable with this as the development default, so a developer runs
# `make up` and then the service, with no setup step in between.

spring:
  application:
    name: catalog

  # ---------------------------------------------------------------------------
  # VIRTUAL THREADS (ADR-0111)
  #
  # This service is Spring MVC and blocks on purpose: JPA, JDBC and a
  # RestClient hop are all blocking, and wrapping them in Reactor would buy the
  # programming model without the throughput. Virtual threads are what make
  # that choice scale -- a parked carrier thread costs a few hundred bytes
  # instead of a megabyte of stack -- and on Java 25 they arrive without the
  # caveat that used to come with them: JEP 491 removed the pinning that made
  # a `synchronized` block hold its carrier, which is what Hikari and the
  # Postgres driver are full of.
  #
  # WHAT THIS CHANGES OPERATIONALLY, because it is not nothing. Tomcat's
  # 200-thread pool was the platform's real admission control, and it is gone:
  # every accepted request now gets a thread. The queue moves to the
  # connection pool above, so `maximum-pool-size` is the concurrency limit and
  # a burst waits there rather than at the connector. That is the better place
  # to wait -- it is the resource that is actually scarce -- but it means the
  # pool size is now a capacity decision rather than a database courtesy.
  #
  # T-1.1's tenant propagation survives this, and it was checked rather than
  # assumed: Boot's virtual-thread executor is built by SimpleAsyncTaskExecutor
  # Builder, which applies the single TaskDecorator bean exactly as the pooled
  # one did. TenantTaskDecoratorSurvivesVirtualThreadsTest pins it, because the
  # failure if it ever stops being true is an @Async method running under the
  # wrong tenant rather than an error.
  # ---------------------------------------------------------------------------
  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      # OFF. Nothing is uploaded here: a content item POINTS at a video, a
      # package or a document, and the bytes belong to streaming or packaging.
      # A multipart parser on this service would be a door onto a path that
      # should not exist (the same reasoning streaming applies to its own).
      enabled: false

  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USER:catalog}
    password: ${CATALOG_DB_PASSWORD:catalog}
    hikari:
      # The template's 10, unmeasured and said so. This service's shape is
      # ordinary reads and occasional writes, with nothing yet to argue it
      # away from the default -- and reporting's load run (docs/slos.md) is a
      # standing reminder that a pool size changed without a measurement is a
      # guess wearing a measurement's clothes.
      maximum-pool-size: 10
      pool-name: catalog

  data:
    jpa:
      repositories:
        # Lazy, for identity's reason: repository initialization validates
        # queries by opening a session on the startup thread, which binds no
        # tenant, and the T-1.1 resolver rightly refuses one. The tests reach
        # every repository, so a broken derived query still cannot reach a
        # deploy.
        bootstrap-mode: lazy

    redis:
      # The tenant status fast path only (T-1.4). A suspended company must not
      # be able to edit its catalog either.
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:}
      connect-timeout: 250ms
      timeout: 250ms
      client-name: catalog
      repositories:
        enabled: false

  jpa:
    hibernate:
      # validate, never update. The migration is written first and the entity
      # matches it; `update` would reshape the schema silently and the
      # migration history would stop describing the database.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # The tenant discriminator is the persistence layer's job (T-1.1), which
      # is what makes a forgotten WHERE clause a query that was already
      # filtered rather than a data leak.
      hibernate.tenant_identifier_resolver: com.xenopsoftware.learn.common.tenancy.TenantIdentifierResolver

  flyway:
    enabled: true
    # ---------------------------------------------------------------------------
    # NAMESPACED BY MODULE, and this is a merge prerequisite rather than tidiness
    # (ADR-0109, ADR-0111).
    #
    # Every module numbered its migrations from V1, which is correct while each
    # runs in its own process reading its own classpath. It stops being correct
    # the moment two modules share one: `classpath:db/migration` then resolves
    # across BOTH jars, Flyway finds two different V1__ files, and refuses to
    # start with "Found more than one migration with version 1".
    #
    # identity and catalog have V1..V8 in common today. ADR-0109 puts them in
    # one process, so the paths are separated now -- before there is a second
    # module in the room -- rather than during the merge, where it would look
    # like part of it.
    #
    # SAFE ON AN EXISTING DATABASE: flyway_schema_history keys on version and
    # description, not on where the file was read from, so a relocated file with
    # the same name is the same migration. The four databases keep their own
    # histories regardless; nothing re-runs.
    # ---------------------------------------------------------------------------
    locations: classpath:db/migration/catalog
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/xenopslearn}

# Service-to-service (T-9.11): this service's own credential, rotatable alone.
platform:
  service-auth:
    client-id: ${SERVICE_CLIENT_ID:svc-catalog}
    client-secret: ${SERVICE_CLIENT_SECRET:local-development-only-catalog-secret}
  services:
    endpoints:
      identity: ${IDENTITY_URL:http://localhost:8082}
      streaming: ${STREAMING_URL:http://localhost:8083}
      reporting: ${REPORTING_URL:http://localhost:8084}
      catalog: ${CATALOG_URL:http://localhost:8085}

  # The transactional outbox and the bus (T-9.8).
  outbox:
    # On for the services that publish or consume. A service with neither pays
    # for none of it -- no relay, no scheduled task, no broker connection.
    enabled: true
    # How often the relay drains. A second is unnoticeable to a person and keeps
    # the backlog metric near zero when things are working, which is what makes
    # the age alarm meaningful.
    interval: PT1S
    batch-size: 100
  messaging:
    # EMPTY BY DEFAULT, and that is the local default rather than the only one.
    # Without it the outbox still fills and drains, and messages are delivered
    # nowhere -- with a WARN at every startup, because a green run against that
    # proves the outbox works and nothing at all about the bus.
    nats-url: ${NATS_URL:}
    poll-interval: PT1S
    batch-size: 50

  # Mail (T-5.6). On, because this service sends reminders -- and unconfigured
  # by default, which is not the same thing. With no spring.mail.host the
  # LoggingMailer is wired: every reminder is claimed, recorded and delivered
  # nowhere, with a WARN at startup. That is the local default for the same
  # reason the bus has no broker locally, and it is said out loud because a
  # green test run against it proves the call sites work and nothing about mail.
  mail:
    enabled: true
    from: ${MAIL_FROM:}

# Due dates, recurrence and reminders (T-5.6).
catalog:
  due:
    # THE HOUR IS IN THE LEARNER'S OWN TIMEZONE, not the server's. A server-side
    # "send at 09:00" reaches a third of a global company in the middle of the
    # night, which is how reminders get filtered to a folder nobody opens.
    send-hour: ${DUE_SEND_HOUR:9}
    # How late a reminder may still be sent. A window missed by longer is
    # RECORDED AS MISSED rather than delivered: a service down for a week must
    # not mail a week of nudges the moment it returns, and must not pretend the
    # window never existed either.
    catch-up: ${DUE_CATCH_UP:P2D}
    # How often the pass runs. The pass is idempotent -- the claim is a primary
    # key -- so this is a latency knob and not a correctness one.
    interval: ${DUE_INTERVAL:PT15M}

  # The learner home screen (T-5.8).
  home:
    # HOW LONG AN ASSEMBLED SCREEN IS KEPT. Everything that CHANGES the screen
    # bumps a version and makes the cached copy unaddressable immediately -- but
    # nothing changes at midnight, and a deadline expiring is exactly that. One
    # minute is long enough to absorb a reload and a second tab, and short enough
    # that "overdue" is never wrong by more than that against a deadline measured
    # in days.
    cache-ttl: ${HOME_CACHE_TTL:PT1M}
    # After a Valkey failure, stop trying for this long. A cache outage should
    # cost one timeout, not one per request; screens are built from Postgres
    # meanwhile, which is what a miss does anyway.
    cache-cooldown: ${HOME_CACHE_COOLDOWN:PT30S}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    db:
      enabled: true
    redis:
      # Off, for identity's reason: DOWN on the aggregate would stop a rollout
      # for a dependency this service is built to run without.
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  level:
    com.xenopsoftware.learn: DEBUG
