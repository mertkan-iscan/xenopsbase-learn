# streaming — configuration.
#
# Values here are the LOCAL STACK's. Anything that differs per environment is an
# environment variable with this as the development default, so a developer runs
# `make up` and then the service, with no setup step in between.

spring:
  application:
    name: streaming

  servlet:
    multipart:
      # OFF, as a design statement (T-3.2): video bytes must not pass through
      # a request thread. Uploads go directly to the provider's target; the
      # day someone needs multipart here for anything, this line is the
      # conversation they have to have first.
      enabled: false

  datasource:
    url: ${STREAMING_DB_URL:jdbc:postgresql://localhost:5432/streaming}
    username: ${STREAMING_DB_USER:streaming}
    password: ${STREAMING_DB_PASSWORD:streaming}
    hikari:
      maximum-pool-size: 10
      pool-name: streaming

  data:
    redis:
      # The status fast path only (T-1.4); this service caches nothing else.
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      # Empty by default, and that is the LOCAL default rather than the only
      # one. The compose Valkey has no password; the cluster's requires one
      # (`requirepass`), so a deployment that could not supply it would fail
      # every cache read with NOAUTH and degrade silently into the "Valkey is
      # down" path this service is built to survive -- which is the worst
      # possible shape, because nothing would look broken (T-9.3).
      password: ${VALKEY_PASSWORD:}
    jpa:
      repositories:
        # Same reason as identity's: repository bootstrap opens a session on
        # the tenant-less startup thread, and the resolver rightly refuses it.
        bootstrap-mode: lazy

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # The tenant discriminator is the persistence layer's job (T-1.1).
      hibernate.tenant_identifier_resolver: com.xenopsoftware.learn.common.tenancy.TenantIdentifierResolver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/xenopslearn}

# Service-to-service (T-9.11). This service's own credential, per service and
# rotatable on its own -- a shared secret would make rotating any of them an
# outage for all of them, and would let any service claim to be another.
platform:
  service-auth:
    client-id: ${SERVICE_CLIENT_ID:svc-streaming}
    client-secret: ${SERVICE_CLIENT_SECRET:local-development-only-streaming-secret}
  services:
    # Named targets, so a relay can only reach somewhere an operator configured.
    endpoints:
      identity: ${IDENTITY_URL:http://localhost:8082}
      streaming: ${STREAMING_URL:http://localhost:8083}
      reporting: ${REPORTING_URL:http://localhost:8084}

  # The transactional outbox and the bus (T-9.8). On here because this service
  # now announces something: a learner finished an item (T-3.7). A completion
  # written without its event would leave the gate behind it shut forever, and
  # an event without the row would open a gate for training nobody did -- which
  # is why the announcement is a row in the same transaction rather than a call.
  outbox:
    enabled: true
    interval: PT1S
    batch-size: 100
  messaging:
    # EMPTY BY DEFAULT, and that is the local default rather than the only one.
    # Without it the outbox still fills and drains, and messages are delivered
    # nowhere -- with a WARN at every startup, because a green run against that
    # proves the outbox works and nothing at all about the bus.
    nats-url: ${NATS_URL:}
    poll-interval: PT1S
    batch-size: 50

server:
  port: ${SERVER_PORT:8083}

streaming:
  upload:
    # Per-upload ceiling: Cloudflare Stream's own maximum per video is 30GB,
    # so a larger declared size would fail at the vendor anyway -- better
    # here, before a target is minted.
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:32212254720}
    # One number for every tenant until the tenant table (T-1.5) gives quota
    # a per-tenant home. 500GB.
    tenant-quota-bytes: ${UPLOAD_TENANT_QUOTA_BYTES:536870912000}
    # How long a PENDING_UPLOAD may sit untouched before the reaper takes it.
    # Re-issuing a target resets the clock.
    abandon-after: ${UPLOAD_ABANDON_AFTER:PT24H}
    reap-interval: ${UPLOAD_REAP_INTERVAL:PT15M}

  playback:
    # THE REVOCATION WINDOW. An issued playback token cannot be recalled from
    # the edge (ADR-0101), so this number is the exact bound on how long a
    # suspended company, a revoked assignment or a deactivated user keeps
    # watching -- T-1.4's "within one token lifetime" is this line.
    #
    # Five minutes. Shorter tightens the bound but puts renewal on the critical
    # path often enough that a slow identity call becomes a stall the learner
    # sees; longer is cheaper per viewer and worse at the only job the number
    # has. PlaybackGrant.MAX_VALIDITY is the 30-minute ceiling nobody may pass
    # without an ADR-0101 conversation; startup fails rather than clamps.
    token-ttl: ${PLAYBACK_TOKEN_TTL:PT5M}
    # When the player asks for the next one. Well before expiry, deliberately:
    # a player that renews at expiry has already stalled. At three minutes there
    # are two more of valid playback to retry in.
    renew-after: ${PLAYBACK_RENEW_AFTER:PT3M}
    # Minting hands out signed URLs that work without us, so a caller in a loop
    # can farm a stock of them and the TTL stops mattering. A watching learner
    # needs about one mint per three minutes per stream; twenty per five minutes
    # leaves an order of magnitude for reloads, seeks and a few tabs, and stops
    # a loop within a second.
    mints-per-window: ${PLAYBACK_MINTS_PER_WINDOW:20}
    mint-window: ${PLAYBACK_MINT_WINDOW:PT5M}

  progress:
    # THE COMPLETION THRESHOLD (ADR-0107). 90% of the provider-reported extent,
    # because the last few seconds of a video are credits and a dropped final
    # heartbeat is ordinary -- and because 75 would pass a learner who skipped
    # the last quarter, who did not do the training. Per item where an item says
    # so; this is what applies when it does not.
    default-threshold-percent: ${PROGRESS_THRESHOLD_PERCENT:90}
    # THE SIZE BOUND. Straight-through playback is one fragment; fragments come
    # only from seeking, and the simulation in docs/slos.md put a deliberate
    # scrubber in the low twenties over a whole video. Sixty-four leaves an order
    # of magnitude over that and still bounds the work a heartbeat can do. At the
    # cap the smallest gap is closed and the row is marked approximate.
    max-fragments: ${PROGRESS_MAX_FRAGMENTS:64}
    # Gaps this small are noise from a ten-second heartbeat's sampling, not
    # unwatched content. Two seconds is also the most this can add per gap.
    coalesce-gap-seconds: 2
    # The same bounds reporting's ingest applies (T-3.6), so a batch analytics
    # accepts is never one progress refuses.
    max-samples-per-batch: 60
    max-interval-seconds: 120
    min-rate: 0.25
    # The fastest the player offers, and therefore the most video wall clock can
    # account for. Narrower than reporting's band deliberately: that one
    # validates a number a client reported, this one bounds what is CREDITED.
    max-rate: 2.0
    # One full client buffer of grace, so a learner returning from an outage is
    # not called a liar for posting the sixty samples they buffered.
    rate-grace: PT2M
    # How long an item's threshold and seek rule may be assumed unchanged. An
    # author changing a threshold expects it to take effect; a heartbeat may not
    # ask catalog for it. An hour is where those two meet.
    policy-refresh: PT1H
    # The same "is this still continuous playback" threshold the player uses, so
    # an honest player is never refused by the no-skipping-ahead rule.
    seek-tolerance-seconds: 3

  media:
    # `fake` is the local default because video is the one dependency with no
    # local equivalent (local-stack.md). `cloudflare-stream` needs the values
    # below, which arrive with T-9.14's real accounts.
    provider: ${MEDIA_PROVIDER:fake}
  cloudflare-stream:
    account-id: ${CF_STREAM_ACCOUNT_ID:}
    api-token: ${CF_STREAM_API_TOKEN:}
    signing-key-id: ${CF_STREAM_SIGNING_KEY_ID:}
    signing-key-jwk: ${CF_STREAM_SIGNING_KEY_JWK:}
    # The account's delivery host, as in customer-<subdomain>.cloudflarestream.com.
    # Every manifest URL is served from it, so a wrong or missing value fails at
    # PLAYBACK -- after an upload has already succeeded, which is the worst place
    # to discover a configuration gap. `scripts/cloudflare-check.sh` derives it by
    # reading an asset back rather than trusting a dashboard page.
    customer-subdomain: ${CF_STREAM_CUSTOMER_SUBDOMAIN:}
    # Blank means NO webhook is trusted (T-3.3), which is the right default: an
    # unverifiable notification is not a notification. The reconciler polls, so a
    # deployment without this is slower rather than broken.
    webhook-secret: ${CF_STREAM_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  level:
    com.xenopsoftware.learn: DEBUG
