# streaming — configuration.
#
# Values here are the LOCAL STACK's. Anything that differs per environment is an
# environment variable with this as the development default, so a developer runs
# `make up` and then the service, with no setup step in between.

spring:
  application:
    name: streaming

  datasource:
    url: ${STREAMING_DB_URL:jdbc:postgresql://localhost:5432/streaming}
    username: ${STREAMING_DB_USER:streaming}
    password: ${STREAMING_DB_PASSWORD:streaming}
    hikari:
      maximum-pool-size: 10
      pool-name: streaming

  data:
    jpa:
      repositories:
        # Same reason as identity's: repository bootstrap opens a session on
        # the tenant-less startup thread, and the resolver rightly refuses it.
        bootstrap-mode: lazy

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # The tenant discriminator is the persistence layer's job (T-1.1).
      hibernate.tenant_identifier_resolver: com.xenopsoftware.learn.common.tenancy.TenantIdentifierResolver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/xenopslearn}

server:
  port: ${SERVER_PORT:8083}

streaming:
  media:
    # `fake` is the local default because video is the one dependency with no
    # local equivalent (local-stack.md). `cloudflare-stream` needs the values
    # below, which arrive with T-9.14's real accounts.
    provider: ${MEDIA_PROVIDER:fake}
  cloudflare-stream:
    account-id: ${CF_STREAM_ACCOUNT_ID:}
    api-token: ${CF_STREAM_API_TOKEN:}
    signing-key-id: ${CF_STREAM_SIGNING_KEY_ID:}
    signing-key-jwk: ${CF_STREAM_SIGNING_KEY_JWK:}

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  level:
    com.xenopsoftware.learn: DEBUG
