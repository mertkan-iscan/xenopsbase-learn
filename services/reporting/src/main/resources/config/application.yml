# reporting — configuration.
#
# Values here are the LOCAL STACK's. Anything that differs per environment is an
# environment variable with this as the development default, so a developer runs
# `make up` and then the service, with no setup step in between.

spring:
  application:
    name: reporting

  servlet:
    multipart:
      # OFF. Nothing is uploaded to this service; telemetry arrives as JSON
      # batches whose size is bounded below (T-3.6).
      enabled: false

  datasource:
    url: ${REPORTING_DB_URL:jdbc:postgresql://localhost:5432/reporting}
    username: ${REPORTING_DB_USER:reporting}
    password: ${REPORTING_DB_PASSWORD:reporting}
    hikari:
      # Still the template's 10, and that is a decision rather than an
      # oversight (T-3.6). This service's shape argues for a bigger pool --
      # every request is a short write and there are hundreds per second -- so
      # the load test tried 32 against 10, three runs each.
      #
      # The machine could not tell them apart. Median request latency at a
      # FIXED pool size ranged from 25ms to 1,039ms across runs, which is
      # wider than the difference being looked for. Raising the number on
      # evidence that weak would be a guess wearing a measurement's clothes.
      #
      # docs/slos.md records the runs. The figure is worth revisiting on
      # hardware that is not also running the load generator and the database.
      maximum-pool-size: ${REPORTING_DB_POOL_SIZE:10}
      pool-name: reporting

  data:
    redis:
      # The tenant status fast path only (T-1.4); this service caches nothing else.
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      # Empty by default, and that is the LOCAL default rather than the only
      # one. The compose Valkey has no password; the cluster's requires one
      # (`requirepass`), so a deployment that could not supply it would fail
      # every cache read with NOAUTH and degrade silently into the "Valkey is
      # down" path this service is built to survive -- which is the worst
      # possible shape, because nothing would look broken (T-9.3).
      password: ${VALKEY_PASSWORD:}
    jpa:
      repositories:
        # Same reason as identity's: repository bootstrap opens a session on
        # the tenant-less startup thread, and the resolver rightly refuses it.
        bootstrap-mode: lazy

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # The tenant discriminator is the persistence layer's job (T-1.1).
      hibernate.tenant_identifier_resolver: com.xenopsoftware.learn.common.tenancy.TenantIdentifierResolver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/xenopslearn}

# Service-to-service (T-9.11). This service's own credential, per service and
# rotatable on its own -- a shared secret would make rotating any of them an
# outage for all of them, and would let any service claim to be another.
platform:
  service-auth:
    client-id: ${SERVICE_CLIENT_ID:svc-reporting}
    client-secret: ${SERVICE_CLIENT_SECRET:local-development-only-reporting-secret}
  services:
    # Named targets, so a relay can only reach somewhere an operator configured.
    endpoints:
      identity: ${IDENTITY_URL:http://localhost:8082}
      streaming: ${STREAMING_URL:http://localhost:8083}
      reporting: ${REPORTING_URL:http://localhost:8084}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  level:
    com.xenopsoftware.learn: DEBUG

# Telemetry ingest (T-3.6). Every number here exists to make the work per
# request finite: this is the one write path allowed to shed load, and a
# request whose cost is set by its caller cannot be shed usefully -- it is
# already holding a connection by the time anybody decides to.
reporting:
  telemetry:
    # A player buffers one sample per ten seconds, so sixty is ten minutes of
    # being offline. Past that the CLIENT drops its oldest samples rather than
    # growing, so a batch this size means the learner was away, not that
    # something is wrong.
    max-samples-per-batch: ${TELEMETRY_MAX_SAMPLES:60}
    # The longest slice one sample may claim. A ten-second heartbeat at 2x
    # covers twenty seconds of video; this sits well above that and well below
    # "the whole film in one sample", which is what a forged interval looks
    # like.
    max-interval-seconds: ${TELEMETRY_MAX_INTERVAL_SECONDS:120}
    min-rate: ${TELEMETRY_MIN_RATE:0.25}
    max-rate: ${TELEMETRY_MAX_RATE:4.0}
    max-skew: ${TELEMETRY_MAX_SKEW:PT10M}
