# identity — configuration.
#
# Values here are the LOCAL STACK's. Anything that differs per environment is an
# environment variable with this as the development default, so a developer runs
# `make up` and then the service, with no setup step in between.

spring:
  application:
    name: identity

  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${IDENTITY_DB_USER:identity}
    password: ${IDENTITY_DB_PASSWORD:identity}
    hikari:
      # Named, because a pool size is part of the connection budget across every
      # service and the database's max_connections. An unstated default becomes
      # a number nobody can account for when the eighth service is added.
      maximum-pool-size: 10
      pool-name: identity

  data:
    jpa:
      repositories:
        # Repository initialization validates queries by opening a session, on
        # the startup thread, which binds no tenant -- and the resolver below
        # rightly refuses a session with no tenant. Lazy defers that first
        # session to the first real use, which happens inside a request with
        # its tenant bound. The trade: a broken derived query surfaces at
        # first use instead of at boot; the tests reach every repository, so
        # it still cannot reach a deploy.
        bootstrap-mode: lazy

    redis:
      # Valkey, for the permission cache (T-2.5). Timeouts are short and stated:
      # a cache is a shortcut, and a shortcut that can block a request for
      # seconds is a slower path than the one it replaced. On a failure the
      # cache stops being consulted for `identity.authz.cache.cooldown`, so a
      # dead Valkey costs one timeout per window rather than one per request.
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      connect-timeout: 250ms
      timeout: 250ms
      client-name: identity
      repositories:
        # Off: Valkey is a cache here, never a store. Left on, Spring Data
        # scans every JPA repository as a Redis repository candidate and logs
        # a paragraph about each one at every boot -- seven warnings that
        # describe a configuration nobody chose.
        enabled: false

  jpa:
    hibernate:
      # validate, never update. An entity that disagrees with its migration
      # refuses to start, which is the point: the migration is written first and
      # the entity matches it. `update` would silently reshape the schema and
      # the migration history would stop describing the database.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # The tenant discriminator is the persistence layer's job, not each
      # query's (T-1.1). With this resolver plus @TenantId on TenantOwned,
      # Hibernate stamps tenant_id on insert and filters every query by it --
      # a forgotten WHERE clause is then a query that was already filtered,
      # not a data leak. Declared here by class name, visibly, because
      # Hibernate instantiates it reflectively rather than as a bean.
      hibernate.tenant_identifier_resolver: com.xenopsoftware.learn.common.tenancy.TenantIdentifierResolver

  flyway:
    enabled: true
    locations: classpath:db/migration
    # No baseline-on-migrate. It exists to adopt a database that already has a
    # schema, and using it on a fresh project means a failed first migration is
    # recorded as "already applied" instead of failing.
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/xenopslearn}

identity:
  platform:
    # The installation's root of trust (T-1.5). Every grant comes from a grant
    # somebody already held, so the chain has to start outside itself: these
    # people are invited into the platform tenant and given its sys-admin role
    # at startup. They are INVITED, not created with a password -- this service
    # never holds a credential, not even an operator's.
    #
    # The local default is the realm's seeded platform user, so `make up` plus
    # this service is a working installation. Real environments set it.
    administrators: ${PLATFORM_ADMINISTRATORS:platform-admin@xenopslearn.test}

  invitations:
    # How long a minted invitation token is acceptable (T-1.9). Long enough to
    # survive a weekend and a forwarded message; short enough that one found in
    # a mailbox two years later opens nothing.
    ttl: 7d
    # The ceiling on one CSV import. Stated, because the alternative is a
    # request that runs until a proxy timeout or a heap decides for us.
    max-import-rows: 5000

  impersonation:
    # How long one support session may last (T-2.8). There is no renew endpoint:
    # a longer investigation is a second session with its own reason, which is
    # the record the customer is entitled to. Short enough that "we forgot to
    # close it" cannot become a standing key into a customer's account.
    max-duration: 30m
    # The shortest reason accepted. A required field somebody satisfies with "x"
    # records nothing, and this log is read months later by people who were not
    # there -- including the customer.
    min-reason: 12

  authz:
    cache:
      # The resolved permission set, cached under a key carrying the tenant's
      # authz_version (T-2.5). Off is a supported way to run this service --
      # every resolution then reads the database, which is the same behaviour
      # every cache failure falls back to.
      enabled: ${AUTHZ_CACHE_ENABLED:true}
      # A backstop, not the invalidation mechanism: a grant change bumps the
      # version and orphans the entry immediately. This bounds how long an
      # entry can outlive a change made WITHOUT a bump -- a restore from
      # backup, a fix applied in SQL, a bug.
      ttl: 10m
      # How long an unreachable cache is left alone before it is tried again.
      cooldown: 10s

# Service-to-service (T-9.11). This service's own credential, per service and
# rotatable on its own -- a shared secret would make rotating any of them an
# outage for all of them, and would let any service claim to be another.
platform:
  service-auth:
    client-id: ${SERVICE_CLIENT_ID:svc-identity}
    client-secret: ${SERVICE_CLIENT_SECRET:local-development-only-identity-secret}
  services:
    # Named targets, so a relay can only reach somewhere an operator configured.
    endpoints:
      identity: ${IDENTITY_URL:http://localhost:8082}
      streaming: ${STREAMING_URL:http://localhost:8083}
      reporting: ${REPORTING_URL:http://localhost:8084}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    # Readiness reflects dependencies rather than the process being alive. A
    # service that answers "ready" while its database is gone is a service that
    # takes traffic it cannot serve.
    db:
      enabled: true
    redis:
      # Off, deliberately (T-2.5). The stock indicator reports DOWN when Valkey
      # is unreachable, and DOWN here would stop a rollout for a dependency this
      # service is built to run without -- during a Valkey upgrade, which is
      # exactly when it is most likely to be moving. `permissionCache`
      # contributes the same information as a detail, without claiming the
      # service cannot serve traffic.
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  level:
    com.xenopsoftware.learn: DEBUG
