# Serving a two-document single-page application (T-10.2's deploy, ADR-0110).
#
# Two things here are decisions rather than boilerplate: which paths fall back
# to `index.html`, and what may be cached.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Nothing about the server, its version, or its existence.
    server_tokens off;

    # THE APP'S ROUTES ARE NOT FILES. `/watch/abc` and `/admin/people` exist only
    # in the router, so a reload of either has to be answered with index.html or
    # it is a 404 on a page the person was just looking at.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # THE PLAYER IS THE EXCEPTION, and it matters (ADR-0110). `player.html` is a
    # SECOND document, the one a customer's iframe loads. If a mistyped path
    # under it fell back to index.html, an embedder would get the whole learner
    # application inside their iframe -- a working-looking page that is the
    # wrong product. A miss here is a 404, which is the truth.
    # `^~` and not `=`: an exact match covers /player.html and nothing under it,
    # so /player.html/anything fell through to the catch-all above and served
    # the learner application with a 200. Found by asking for it.
    location ^~ /player.html {
        try_files $uri =404;
    }

    # HASHED ASSETS ARE IMMUTABLE, and that is not an optimisation guess: Vite
    # puts a content hash in every filename under /assets, so a given URL's bytes
    # can never change. hls.js is ~575kB and is downloaded by whoever presses
    # play; re-downloading it on every navigation would be paid by the learner
    # on the worst device.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # AND THE ENTRY DOCUMENTS ARE NOT. index.html and player.html keep their
    # names across releases, so a cached one is a browser pinned to the previous
    # deploy's asset names -- which fails as a blank page after a rollout, on
    # exactly the machines that visit most often.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Health, for the kubelet. A file rather than nginx's stub_status: the
    # question a probe asks is "can this serve a file", and stub_status answers a
    # different one.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Below about a kilobyte the compression header costs more than it saves.
    gzip_min_length 1024;
}
