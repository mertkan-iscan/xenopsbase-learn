<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XenOpsBase Learn</title>
    <!--
      Two families and five faces, and no more. Sora carries the headings; Manrope carries
      everything a person reads at length.

      `display=swap` because a learner on a bad connection should read the sentence saying why
      their course is locked in a fallback face rather than wait for ours — and both stacks in
      styles.css name real fallbacks, so that is a legible page and not a blank one.

      Both families are requested with the Latin Extended range they need: the product ships in
      Turkish, and a face without ğ, ı, İ, ş or ö renders those from a fallback mid-word, which
      looks like a broken page rather than a missing font.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
